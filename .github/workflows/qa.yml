name: QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Generated files are up to date
        run: |
          php bin/build.php
          git diff --exit-code -- . ':(exclude)storage' || { echo "::error::Run php bin/build.php and commit the result"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all -- . ':(exclude)storage')" || { git status --short; echo "::error::build produced untracked files"; exit 1; }

      - name: Quality gate
        run: php bin/qa.php
